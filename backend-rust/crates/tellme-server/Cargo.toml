[package]
name = "tellme-server"
version = "2.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Server-blind Rust backend for the TellMe end-to-end encrypted messenger"
publish = false

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.6", features = ["ws"] }
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
getrandom = "0.2.17"
hmac = "0.12.1"
p256 = { version = "0.13.2", features = ["ecdsa", "pem", "pkcs8"] }
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "rustls-tls-webpki-roots"] }
redis = { version = "1.2.2", default-features = false, features = ["tokio-comp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.10.6"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio"] }
time = { version = "0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
