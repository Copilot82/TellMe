site_name: TellMe — техническая документация
site_description: Архитектура, протокол, эксплуатация и тестирование защищённого мессенджера TellMe
site_url: https://copilot82.github.io/TellMe/
repo_url: https://github.com/Copilot82/TellMe
repo_name: Copilot82/TellMe
edit_uri: ""
copyright: TellMe Project, 2026

theme:
  name: material
  language: ru
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - ru
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ru
          default: true
          name: Русский
          build: true
        - locale: en
          name: English
          build: true
          site_name: TellMe — technical documentation
          site_description: Architecture, protocol, operations, and testing of the TellMe secure messenger
          theme:
            language: en
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: indigo
                accent: blue
                toggle:
                  icon: material/brightness-7
                  name: Switch to dark mode
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: indigo
                accent: light-blue
                toggle:
                  icon: material/brightness-4
                  name: Switch to light mode
          nav_translations:
            Обзор: Overview
            Внедрение: Deployment
            Требования: Requirements
            Развёртывание: Production deployment
            Apple Developer и iOS: Apple Developer and iOS
            Проверка установки: Installation verification
            Backup и restore: Backup and restore
            Диагностика: Troubleshooting
            Архитектура: Architecture
            Модель угроз: Threat model
            Криптографический протокол: Cryptographic protocol
            Контракт API: API contract
            Разработка: Development
            Локальный запуск: Local development
            Стратегия тестирования: Testing strategy
            Стиль кода: Code style
            Эксплуатация: Operations
            Архитектурные решения: Architecture decisions
            Реестр ADR: ADR index
            "ADR-0001: сервер не имеет доступа к содержимому": "ADR-0001: server-blind storage"
            "ADR-0002: шифрование на устройство": "ADR-0002: per-device encryption"
            "ADR-0003: сервер на Rust": "ADR-0003: Rust backend"
            "ADR-0004: realtime не является источником истины": "ADR-0004: realtime is not the source of truth"
            Инженерные разборы: Engineering case studies
            Стабилизация Picture in Picture: Picture in Picture stabilization
            Настройка GitHub: GitHub configuration

nav:
  - Обзор: README.md
  - Внедрение:
      - Требования: requirements.md
      - Развёртывание: deployment.md
      - Apple Developer и iOS: apple-setup.md
      - Проверка установки: deployment-verification.md
      - Backup и restore: backup-and-restore.md
      - Диагностика: troubleshooting.md
  - Архитектура: architecture.md
  - Модель угроз: threat-model.md
  - Криптографический протокол: protocol.md
  - Контракт API: api.md
  - Разработка:
      - Локальный запуск: local-development.md
      - Стратегия тестирования: testing.md
      - Стиль кода: code-style.md
  - Эксплуатация: operations.md
  - Архитектурные решения:
      - Реестр ADR: adr/README.md
      - "ADR-0001: сервер не имеет доступа к содержимому": adr/0001-server-blind-storage.md
      - "ADR-0002: шифрование на устройство": adr/0002-per-device-encryption.md
      - "ADR-0003: сервер на Rust": adr/0003-rust-backend.md
      - "ADR-0004: realtime не является источником истины": adr/0004-realtime-is-not-source-of-truth.md
  - Инженерные разборы:
      - Стабилизация Picture in Picture: case-studies/pip-stabilization.md
  - Настройка GitHub: github-settings.md
