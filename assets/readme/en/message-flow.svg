<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">TellMe encrypted message flow</title>
  <desc id="desc">A sender fetches recipient prekeys, creates an X3DH and Double Ratchet session, sends encrypted per-device data, and the receiver decrypts locally.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#365f45"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2933" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="980" height="430" rx="18" fill="#f8faf7"/>
  <text x="42" y="48" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#17212b">Message delivery flow</text>
  <text x="42" y="78" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#5a6876">Encryption starts on the sender device and ends on the recipient device.</text>

  <line x1="180" y1="120" x2="180" y2="368" stroke="#c7d5c9" stroke-width="2"/>
  <line x1="490" y1="120" x2="490" y2="368" stroke="#c7d5c9" stroke-width="2"/>
  <line x1="800" y1="120" x2="800" y2="368" stroke="#c7d5c9" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="88" y="102" width="184" height="44" rx="10" fill="#ffffff" stroke="#c7d5c9"/>
    <rect x="398" y="102" width="184" height="44" rx="10" fill="#ffffff" stroke="#c7d5c9"/>
    <rect x="708" y="102" width="184" height="44" rx="10" fill="#ffffff" stroke="#c7d5c9"/>
  </g>
  <text x="126" y="130" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#17212b">Alice device</text>
  <text x="435" y="130" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#17212b">Server</text>
  <text x="746" y="130" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#17212b">Bob device</text>

  <path d="M 188 178 L 482 178" stroke="#365f45" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="250" y="166" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#365f45">fetch Bob device prekeys</text>

  <path d="M 482 220 L 188 220" stroke="#365f45" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="278" y="208" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#365f45">public prekey bundle</text>

  <rect x="70" y="246" width="220" height="54" rx="10" fill="#edf6ee" stroke="#b8cbbd"/>
  <text x="96" y="268" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#17212b">Local crypto step</text>
  <text x="96" y="288" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#506070">X3DH + Double Ratchet</text>

  <path d="M 188 324 L 482 324" stroke="#365f45" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="244" y="312" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#365f45">encrypted per-device message</text>

  <path d="M 498 324 L 792 324" stroke="#365f45" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="585" y="312" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#365f45">encrypted mailbox blob</text>

  <rect x="690" y="348" width="220" height="40" rx="10" fill="#edf6ee" stroke="#b8cbbd"/>
  <text x="740" y="373" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#506070">decrypt locally</text>
</svg>
